<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
        <!-- Izquierda: Botón hamburguesa móvil y título -->
        <div class="flex items-center space-x-3">
            <button id="sidebar-toggle-btn"
                    type="button"
                    class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    aria-label="Abrir menú de navegación">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="hidden sm:block">
                <span class="text-xs font-semibold text-emerald-700 uppercase tracking-wider block" th:text="#{app.nombre}">
                    Institución Educativa Jesús Nazareno
                </span>
                <span class="text-sm font-bold text-slate-800" th:text="#{app.descripcion}">
                    Sistema Web de Control de Asistencia
                </span>
            </div>
            <div class="sm:hidden font-bold text-sm text-slate-800">
                SGE Asistencia
            </div>
        </div>

        <!-- Derecha: Notificaciones, Datos de usuario y botón de cierre de sesión seguro -->
        <div class="flex items-center space-x-3 sm:space-x-4">

            <!-- Icono / Botón de Notificaciones con Badge de Conteo -->
            <a th:href="@{/notificaciones}"
               id="notificaciones-header-btn"
               title="Notificaciones internas"
               class="relative p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
                <!-- Badge de contador no leídas -->
                <span th:if="${contadorNotificacionesNoLeidas != null and contadorNotificacionesNoLeidas > 0}"
                      id="contador-notificaciones-badge"
                      class="absolute top-1 right-1 inline-flex items-center justify-center px-1.5 py-0.5 text-[10px] font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-rose-600 rounded-full shadow-sm">
                    <span th:text="${contadorNotificacionesNoLeidas > 99 ? '99+' : contadorNotificacionesNoLeidas}">3</span>
                </span>
            </a>

            <!-- Información de usuario -->
            <div class="flex items-center space-x-2 text-right">
                <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center justify-center border border-emerald-300">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div class="hidden md:block text-left">
                    <div class="text-xs font-bold text-slate-800" sec:authentication="name">
                        usuario
                    </div>
                    <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider"
                         sec:authentication="principal.authorities">
                        ROL
                    </div>
                </div>
            </div>

            <!-- Botón de Logout Seguro (POST con CSRF) -->
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit"
                        title="Cerrar sesión"
                        aria-label="Cerrar sesión"
                        class="inline-flex items-center px-3 py-1.5 border border-red-200 text-xs font-medium rounded-lg text-red-700 bg-red-50 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-red-500 transition duration-150">
                    <svg class="w-4 h-4 sm:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span class="hidden sm:inline">Cerrar sesión</span>
                </button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
