<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' - ' + #{app.nombre}">Iniciar sesión - Institución Educativa Jesús Nazareno</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Encabezado con Franja Institucional (Verde, Amarillo, Rojo) -->
        <div class="h-2.5 bg-gradient-to-r from-emerald-700 via-amber-400 to-red-600"></div>

        <div class="p-8">
            <!-- Emblema / Identidad Visual Segura -->
            <div class="flex flex-col items-center mb-6">
                <div class="relative w-20 h-20 rounded-full bg-emerald-800 text-white flex items-center justify-center font-bold text-3xl shadow-lg border-4 border-amber-400 mb-3">
                    <!-- Insignia segura sin provocar imágenes rotas -->
                    <span class="tracking-tighter">JN</span>
                </div>
                <h1 class="text-xl font-bold text-slate-800 text-center uppercase tracking-wide" th:text="#{app.nombre}">
                    Institución Educativa Jesús Nazareno
                </h1>
                <p class="text-xs font-semibold text-emerald-700 mt-1 uppercase tracking-wider" th:text="#{app.descripcion}">
                    Sistema Web de Control de Asistencia
                </p>
            </div>

            <!-- Alerta de Error -->
            <div th:if="${param.error != null or loginError != null}"
                 class="mb-5 p-3.5 bg-red-50 border-l-4 border-red-600 text-red-700 text-sm rounded-r-md flex items-center shadow-sm">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                </svg>
                <span th:text="#{login.error}">Usuario o contraseña incorrectos.</span>
            </div>

            <!-- Alerta de Cierre de Sesión -->
            <div th:if="${param.logout != null or logoutSuccess != null}"
                 class="mb-5 p-3.5 bg-emerald-50 border-l-4 border-emerald-600 text-emerald-800 text-sm rounded-r-md flex items-center shadow-sm">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                </svg>
                <span th:text="#{login.logout}">Sesión cerrada correctamente.</span>
            </div>

            <!-- Formulario de Login -->
            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5" th:text="#{login.username}">
                        Usuario
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <input type="text"
                               id="username"
                               name="username"
                               required
                               autofocus
                               autocomplete="username"
                               placeholder="Ingrese su usuario"
                               class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 text-sm transition duration-150">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5" th:text="#{login.password}">
                        Contraseña
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               autocomplete="current-password"
                               placeholder="••••••••"
                               class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 text-sm transition duration-150">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full py-2.5 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-medium text-sm rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition duration-200">
                        <span th:text="#{login.submit}">Iniciar sesión</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Pie de página institucional -->
        <div class="px-8 py-4 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-500">
            &copy; 2026 Institución Educativa Jesús Nazareno. Todos los derechos reservados.
        </div>
    </div>

</body>
</html>
