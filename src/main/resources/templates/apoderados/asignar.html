<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout('Asignar Apoderado', 'estudiantes', ~{::#asignar-apoderado-content})}">
<head>
    <title>Asignar Apoderado al Estudiante</title>
</head>
<body>
<div id="asignar-apoderado-content" class="max-w-2xl mx-auto space-y-6">

    <!-- Encabezado -->
    <div class="pb-3 border-b border-slate-200">
        <nav class="flex text-xs text-slate-500 mb-1" aria-label="Breadcrumb">
            <a th:href="@{/estudiantes}" class="hover:text-emerald-700">Estudiantes</a>
            <span class="mx-2 text-slate-400">/</span>
            <a th:href="@{/estudiantes/{id}(id=${estudiante.id})}" class="hover:text-emerald-700" th:text="${estudiante.numeroDocumento}">77889900</a>
            <span class="mx-2 text-slate-400">/</span>
            <span class="text-slate-800 font-semibold">Asignar Apoderado</span>
        </nav>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
            Asignar Apoderado al Estudiante
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
            Vincule un apoderado registrado o tutor legal con el estudiante
        </p>
    </div>

    <!-- Tarjeta del Estudiante -->
    <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex items-center space-x-4">
        <div class="w-12 h-12 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold text-lg flex-shrink-0">
            <span th:text="${(estudiante.nombres != null and !estudiante.nombres.isEmpty() ? #strings.substring(estudiante.nombres, 0, 1) : '') + (estudiante.apellidoPaterno != null and !estudiante.apellidoPaterno.isEmpty() ? #strings.substring(estudiante.apellidoPaterno, 0, 1) : '')}">CM</span>
        </div>
        <div class="overflow-hidden">
            <h2 class="text-sm font-bold text-slate-900 truncate"
                th:text="${estudiante.nombres + ' ' + estudiante.apellidoPaterno + (estudiante.apellidoMaterno != null ? ' ' + estudiante.apellidoMaterno : '')}">
                Carlos Eduardo Mendoza Flores
            </h2>
            <div class="text-xs text-slate-500 space-x-2 mt-0.5">
                <span>DNI: <strong class="font-mono text-slate-700" th:text="${estudiante.numeroDocumento}">77889900</strong></span>
                <span>•</span>
                <span class="text-emerald-700 font-semibold">Estudiante Activo</span>
            </div>
        </div>
    </div>

    <!-- Formulario de Asignación -->
    <form th:action="@{/estudiantes/{id}/apoderados(id=${estudiante.id})}"
          th:object="${relacion}"
          method="post"
          class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-5">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" th:field="*{estudianteId}" />

        <!-- Errores Globales -->
        <div th:if="${#fields.hasGlobalErrors()}"
             class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-xs sm:text-sm space-y-1">
            <ul class="list-disc list-inside space-y-0.5 pl-2">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</li>
            </ul>
        </div>

        <!-- Selección de Apoderado -->
        <div>
            <div class="flex items-center justify-between mb-1">
                <label for="apoderadoId" class="block text-xs font-semibold uppercase tracking-wider text-slate-700">
                    Seleccionar Apoderado Registrado <span class="text-red-500">*</span>
                </label>
                <a th:href="@{/apoderados/nuevo(estudianteId=${estudiante.id})}"
                   class="text-xs text-emerald-700 hover:text-emerald-800 font-semibold hover:underline">
                    + ¿No está en la lista? Registrar nuevo
                </a>
            </div>
            <select id="apoderadoId"
                    th:field="*{apoderadoId}"
                    class="w-full py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-lg text-xs sm:text-sm text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600"
                    th:classappend="${#fields.hasErrors('apoderadoId')} ? 'border-red-400 bg-red-50'">
                <option value="">-- Seleccione una persona --</option>
                <option th:each="ap : ${apoderados}"
                        th:if="${ap.id != estudiante.id}"
                        th:value="${ap.id}"
                        th:text="${ap.apellidoPaterno + ' ' + ap.apellidoMaterno + ' ' + ap.nombres + ' (DNI: ' + ap.numeroDocumento + ')'}">
                    Flores Ramos María Elena (DNI: 12345678)
                </option>
            </select>
            <p th:if="${#fields.hasErrors('apoderadoId')}" th:errors="*{apoderadoId}" class="text-xs text-red-600 mt-1"></p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Parentesco -->
            <div>
                <label for="parentesco" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                    Parentesco o Relación <span class="text-red-500">*</span>
                </label>
                <select id="parentesco"
                        th:field="*{parentesco}"
                        class="w-full py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-lg text-xs sm:text-sm text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600"
                        th:classappend="${#fields.hasErrors('parentesco')} ? 'border-red-400 bg-red-50'">
                    <option th:each="p : ${parentescos}" th:value="${p}" th:text="${p.descripcion}">Madre</option>
                </select>
                <p th:if="${#fields.hasErrors('parentesco')}" th:errors="*{parentesco}" class="text-xs text-red-600 mt-1"></p>
            </div>

            <!-- Fecha Inicio -->
            <div>
                <label for="fechaInicio" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                    Fecha de Inicio de Relación
                </label>
                <input type="date"
                       id="fechaInicio"
                       th:field="*{fechaInicio}"
                       class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-xs sm:text-sm text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600">
            </div>
        </div>

        <!-- Checkbox Principal -->
        <div class="p-3 bg-amber-50/70 border border-amber-200 rounded-lg">
            <label class="inline-flex items-center space-x-3 cursor-pointer">
                <input type="checkbox"
                       th:field="*{esPrincipal}"
                       class="w-4 h-4 text-emerald-700 border-slate-300 rounded focus:ring-emerald-500">
                <div class="text-xs sm:text-sm">
                    <span class="font-bold text-slate-900 block">Designar como Apoderado Principal</span>
                    <span class="text-slate-500 text-xs">
                        Será el primer contacto para comunicaciones institucionales y notificaciones.
                    </span>
                </div>
            </label>
        </div>

        <!-- Botones -->
        <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-100">
            <a th:href="@{/estudiantes/{id}(id=${estudiante.id})}"
               class="px-4 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 transition">
                Cancelar
            </a>
            <button type="submit"
                    class="px-6 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-xs sm:text-sm rounded-lg shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-600 transition">
                Asignar al Estudiante
            </button>
        </div>

    </form>

</div>
</body>
</html>
