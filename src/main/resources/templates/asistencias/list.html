<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout('Consulta de Asistencias', 'asistencias', ~{::#asistencias-list-content})}">
<head><title>Consulta de Asistencias</title></head>
<body>
<div id="asistencias-list-content" class="space-y-6">

  <!-- Encabezado -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b border-slate-200">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Consulta de Asistencias</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Registro y consulta de asistencia diaria institucional.</p>
    </div>
    <div sec:authorize="hasAuthority('ASISTENCIA_REGISTRAR')">
      <a th:href="@{/asistencias/registrar}"
         id="btn-registrar-asistencia"
         class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-semibold rounded-lg text-white bg-emerald-700 hover:bg-emerald-800 shadow-sm transition duration-150">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Registrar Asistencia
      </a>
    </div>
  </div>

  <!-- Filtros -->
  <div class="bg-white p-4 sm:p-5 rounded-xl border border-slate-200 shadow-sm">
    <form th:action="@{/asistencias}" method="get" class="grid grid-cols-1 sm:grid-cols-12 gap-3.5 items-end">
      <div class="sm:col-span-12 lg:col-span-3">
        <label for="q" class="block text-xs font-semibold text-slate-700 mb-1">Buscar DNI o estudiante</label>
        <input type="text" id="q" name="q" th:value="${q}" placeholder="Ej. 77889900 o García"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
      </div>
      <div class="sm:col-span-3 lg:col-span-2">
        <label for="anioEscolarId" class="block text-xs font-semibold text-slate-700 mb-1">Año Escolar</label>
        <select id="anioEscolarId" name="anioEscolarId" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">Todos</option>
          <option th:each="a : ${aniosEscolares}" th:value="${a.id}" th:text="${a.anio}" th:selected="${a.id == anioEscolarId}"></option>
        </select>
      </div>
      <div class="sm:col-span-3 lg:col-span-2">
        <label for="gradoId" class="block text-xs font-semibold text-slate-700 mb-1">Grado</label>
        <select id="gradoId" name="gradoId" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">Todos</option>
          <option th:each="g : ${grados}" th:value="${g.id}" th:text="${g.nombre}" th:selected="${g.id == gradoId}"></option>
        </select>
      </div>
      <div class="sm:col-span-3 lg:col-span-2">
        <label for="estadoF" class="block text-xs font-semibold text-slate-700 mb-1">Estado</label>
        <select id="estadoF" name="estado" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">Todos</option>
          <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.name()}" th:selected="${e == estado}"></option>
        </select>
      </div>
      <div class="sm:col-span-3 lg:col-span-2">
        <label for="fechaInicio" class="block text-xs font-semibold text-slate-700 mb-1">Desde</label>
        <input type="date" id="fechaInicio" name="fechaInicio" th:value="${fechaInicio}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
      </div>
      <div class="sm:col-span-3 lg:col-span-2">
        <label for="fechaFin" class="block text-xs font-semibold text-slate-700 mb-1">Hasta</label>
        <input type="date" id="fechaFin" name="fechaFin" th:value="${fechaFin}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
      </div>
      <div class="sm:col-span-6 lg:col-span-2 flex gap-2">
        <button type="submit" id="btn-filtrar" class="flex-1 px-4 py-2 bg-emerald-700 text-white text-sm font-semibold rounded-lg hover:bg-emerald-800 transition">Filtrar</button>
        <a th:href="@{/asistencias}" class="flex-1 px-4 py-2 bg-slate-100 text-slate-700 text-sm font-semibold rounded-lg hover:bg-slate-200 transition text-center">Limpiar</a>
      </div>
    </form>
  </div>

  <!-- Tabla -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200 text-sm">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Fecha</th>
            <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Estudiante</th>
            <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">DNI</th>
            <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Grado/Sección</th>
            <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Estado</th>
            <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Hora Ingreso</th>
            <th class="px-4 py-3 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-slate-100">
          <tr th:if="${asistencias.content.empty}">
            <td colspan="7" class="px-4 py-10 text-center text-slate-400">No se encontraron registros.</td>
          </tr>
          <tr th:each="a : ${asistencias.content}" class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-medium text-slate-700" th:text="${#temporals.format(a.fecha,'dd/MM/yyyy')}"></td>
            <td class="px-4 py-3 text-slate-800" th:text="${a.estudianteNombreCompleto}"></td>
            <td class="px-4 py-3 text-slate-600" th:text="${a.estudianteNumeroDocumento}"></td>
            <td class="px-4 py-3 text-slate-600" th:text="${a.gradoNombre + ' / ' + a.seccionNombre}"></td>
            <td class="px-4 py-3">
              <span th:classappend="${a.estado.name() == 'PRESENTE'} ? 'bg-emerald-100 text-emerald-800' :
                                    (${a.estado.name() == 'TARDANZA'} ? 'bg-amber-100 text-amber-800' :
                                    (${a.estado.name() == 'AUSENTE'} ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'))"
                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                    th:text="${a.estado.name()}"></span>
            </td>
            <td class="px-4 py-3 text-slate-600" th:text="${a.horaIngreso != null ? a.horaIngreso : '-'}"></td>
            <td class="px-4 py-3 text-right space-x-2">
              <a th:href="@{/asistencias/{id}(id=${a.id})}" id="btn-ver-asistencia" class="text-emerald-600 hover:text-emerald-800 font-medium text-xs">Ver</a>
              <a th:href="@{/justificaciones/nueva(asistenciaId=${a.id})}"
                 sec:authorize="hasAuthority('JUSTIFICACION_CREAR')"
                 th:if="${a.estado.name() == 'AUSENTE' or a.estado.name() == 'TARDANZA'}"
                 id="btn-justificar-asistencia" class="text-blue-600 hover:text-blue-800 font-medium text-xs">Justificar</a>
              <a th:href="@{/asistencias/{id}/editar(id=${a.id})}"
                 sec:authorize="hasAuthority('ASISTENCIA_EDITAR')"
                 th:if="${a.estado.name() != 'JUSTIFICADO'}"
                 id="btn-editar-asistencia" class="text-amber-600 hover:text-amber-800 font-medium text-xs">Editar</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <div th:if="${asistencias.totalPages > 1}" class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
      <p class="text-xs text-slate-500">
        Mostrando <span th:text="${asistencias.number * asistencias.size + 1}"></span>-<span th:text="${asistencias.number * asistencias.size + asistencias.numberOfElements}"></span>
        de <span th:text="${asistencias.totalElements}"></span> registros
      </p>
      <div class="flex items-center gap-1">
        <a th:href="@{/asistencias(page=${asistencias.number - 1}, size=${size}, q=${q}, anioEscolarId=${anioEscolarId}, gradoId=${gradoId}, seccionId=${seccionId}, estado=${estado}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}"
           th:if="${!asistencias.first}"
           class="px-2 py-1 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded hover:bg-slate-50">Anterior</a>
        <span th:each="i : ${#numbers.sequence(0, asistencias.totalPages - 1)}"
              th:classappend="${i == asistencias.number} ? 'bg-emerald-700 text-white border-emerald-700' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'"
              class="px-2 py-1 text-xs font-medium border rounded">
          <a th:href="@{/asistencias(page=${i}, size=${size}, q=${q}, anioEscolarId=${anioEscolarId}, gradoId=${gradoId}, seccionId=${seccionId}, estado=${estado}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}"
             th:text="${i + 1}" class="block w-full h-full"></a>
        </span>
        <a th:href="@{/asistencias(page=${asistencias.number + 1}, size=${size}, q=${q}, anioEscolarId=${anioEscolarId}, gradoId=${gradoId}, seccionId=${seccionId}, estado=${estado}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}"
           th:if="${!asistencias.last}"
           class="px-2 py-1 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded hover:bg-slate-50">Siguiente</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
