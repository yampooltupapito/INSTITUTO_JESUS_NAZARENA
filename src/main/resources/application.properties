# Configuración General de la Aplicación
spring.application.name=Institución Educativa Jesús Nazareno
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Zona Horaria y Locale
spring.jackson.time-zone=America/Lima
spring.jackson.locale=es_PE
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
app.timezone=America/Lima
app.locale=es_PE

# Configuración Base de Datos (PostgreSQL - Compatible con Local y Railway)
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:kk}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:jkbnmt09}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

# Configuración JPA / Hibernate
# IMPORTANTE: ddl-auto configurado a validate por arquitectura. La BD se administra externamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/

# Configuración DevTools (Desactivado en producción)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Configuración Actuator (Solo health e info expuestos)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=false

# Configuración de Límites de Exportación de Reportes
reporte.exportacion.max-registros=5000

# Configuración de Carga de Archivos e Importaciones Excel
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
importacion.excel.max-filas=1000
importacion.excel.max-archivo-bytes=5242880
importacion.excel.token-expiracion-minutos=30